<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тамагочи — Здоровье</title>
    <style>
      body {
        background-color: #f0f2f5;
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .game-container {
        text-align: center;
        background-color: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 320px;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 20px;
        transition: color 0.3s ease;
      }

      .health-bar-container {
        width: 200px;
        height: 30px;
        background-color: #e0e0e0;
        border-radius: 15px;
        overflow: hidden;
        margin: 0 auto 20px;
        border: 2px solid #333;
        position: relative;
      }

      #health-bar {
        width: 200px;
        height: 100%;
        background-color: #2ecc71;
        transition: width 0.3s ease, background-color 0.3s ease;
      }

      /* Процент внутри серой рамки */
      #health-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        font-weight: bold;
        color: #222;
        text-shadow: 0 0 3px white;
        pointer-events: none;
        z-index: 2;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .buttons button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        transition: opacity 0.2s;
      }

      .buttons button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #damage-button {
        background-color: #e74c3c;
        color: white;
      }

      #heal-btn {
        background-color: #3498db;
        color: white;
      }

      #mega-damage {
        background-color: #9b59b6;
        color: white;
        width: 100%;
        margin-top: 4px;
      }

      #game-over-message {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: #e74c3c;
        opacity: 0;
        transition: opacity 0.6s ease-in-out;
        pointer-events: none;
        height: 28px;
      }

      #game-over-message.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <h2>Здоровье</h2>

      <div class="health-bar-container">
        <div id="health-bar"></div>
        <!-- Шаг 1: текстовый индикатор внутри серой рамки -->
        <span id="health-text">100%</span>
      </div>

      <div class="buttons">
        <button id="damage-button">Нанести урон</button>
        <button id="heal-btn">Полечить</button>
        <!-- Шаг 2: кнопка супер-удара -->
        <button id="mega-damage">☄️ КРИТ (МЕГА-УРОН)</button>
      </div>

      <div id="game-over-message">Вы погибли</div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
